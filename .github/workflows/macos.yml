name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package universal app
        env:
          JUSTGIT_BUILD: ${{ github.run_number }}
        run: ./Build.command --package "$RUNNER_TEMP/JustGit-package"
      - name: Verify deployment, architectures and signature
        run: bash Tests/CompatibilityTests.sh "$RUNNER_TEMP/JustGit-package/JustGit.app"
      - name: Installer and packaging rollback
        run: bash Tests/BuildTests.sh
      - name: Package native disk images
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/JustGit-package/JustGit.app/Contents/Info.plist")
          for arch in arm64 x64; do
            .github/scripts/package-macos.sh "$RUNNER_TEMP/JustGit-package/JustGit.app" "$version" "$arch" "$RUNNER_TEMP/downloads"
          done
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: JustGit-macOS-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/downloads/*.dmg
          if-no-files-found: error
