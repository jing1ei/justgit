name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install packaging tool
        shell: pwsh
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:PYTHON_EXE -m pip install -r Windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Packaging tool installation failed." }
      # Build.ps1 -Package runs the unit tests and the UI smoke test before
      # packaging, so running them as separate steps would only repeat them.
      - name: Test, smoke-test and package
        shell: pwsh
        env:
          JUSTGIT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./Windows/Build.ps1 -Package
      - name: Build and verify installer
        shell: pwsh
        run: |
          $dirs = @(Get-ChildItem Windows/releases -Directory)
          if ($dirs.Count -ne 1) { throw 'Expected exactly one packaged app.' }
          $version = (Select-String -Path Build.command -Pattern '^VERSION="\$\{JUSTGIT_VERSION:-([^}]+)\}"').Matches[0].Groups[1].Value
          ./.github/scripts/package-windows.ps1 -Application JustGit -Version $version -Architecture x64 -SourceDirectory $dirs[0].FullName -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2022' && matrix.python == '3.12'
        with:
          name: JustGit-Windows-x64-${{ matrix.os }}-py${{ matrix.python }}-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
