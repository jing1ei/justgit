name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: ${{ steps.python.outputs.python-path }} -m pip install pyinstaller
      # Build.ps1 -Package runs the unit tests and the UI smoke test before
      # packaging, so running them as separate steps would only repeat them.
      - name: Test, smoke-test and package
        shell: pwsh
        env:
          JUSTGIT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./Windows/Build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: JustGit-Windows
          path: Windows/releases/
