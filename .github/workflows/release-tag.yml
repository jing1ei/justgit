name: Tagged release

# Builds native macOS DMGs and a Windows EXE installer from a
# pushed semantic tag such as v1.2.3, then publishes a GitHub Release with the
# app archives, the source archive and a SHA256 manifest. A tag only publishes
# after every platform build and its tests pass; main-branch pushes never run
# this, so day-to-day commits cannot cut a release.

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: tagged-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      app-version: ${{ steps.ver.outputs.app-version }}
    steps:
      - name: Resolve and validate version
        id: ver
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          full="${tag#v}"
          core="${full%%-*}"
          [[ "$full" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] \
            || { echo "Tag must look like v1.2.3 (optionally with a -prerelease suffix)"; exit 1; }
          echo "version=$full" >> "$GITHUB_OUTPUT"
          echo "app-version=$core" >> "$GITHUB_OUTPUT"

  macos:
    needs: meta
    name: Build macOS universal app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, self-test and package universal app
        env:
          JUSTGIT_VERSION: ${{ needs.meta.outputs.app-version }}
          JUSTGIT_BUILD: ${{ github.run_number }}
        run: ./Build.command --package "$RUNNER_TEMP/JustGit-package"
      - name: Verify deployment target, architectures and signature
        run: bash Tests/CompatibilityTests.sh "$RUNNER_TEMP/JustGit-package/JustGit.app"
      - name: Run installer and packaging rollback checks
        run: bash Tests/BuildTests.sh
      - name: Package native disk images
        run: |
          for arch in arm64 x64; do
            .github/scripts/package-macos.sh "$RUNNER_TEMP/JustGit-package/JustGit.app" "${{ needs.meta.outputs.version }}" "$arch" dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: JustGit-macOS
          path: dist/JustGit-${{ needs.meta.outputs.version }}-macOS-*.dmg
          if-no-files-found: error

  windows:
    needs: meta
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install packaging tool
        shell: pwsh
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          & $env:PYTHON_EXE -m pip install -r Windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Packaging tool installation failed." }
      # Build.ps1 -Package runs the unit tests, the UI smoke test and a frozen
      # executable smoke test before producing the portable folder.
      - name: Test, smoke-test and package
        shell: pwsh
        env:
          JUSTGIT_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./Windows/Build.ps1 -Package
      - name: Build and verify installer
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $dirs = @(Get-ChildItem Windows/releases -Directory)
          if ($dirs.Count -ne 1) { throw "Expected exactly one packaged application." }
          ./.github/scripts/package-windows.ps1 -Application JustGit -Version $env:VERSION -Architecture x64 -SourceDirectory $dirs[0].FullName -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: JustGit-Windows
          path: dist/JustGit-${{ needs.meta.outputs.version }}-Windows-x64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [meta, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: JustGit-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tooling
        run: python .github/scripts/test_release.py
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_SHA
          python .github/scripts/release.py dist --version "${{ needs.meta.outputs.version }}"
